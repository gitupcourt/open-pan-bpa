name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build all platforms
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
            OUTDIR="dist/bpa_${GOOS}_${GOARCH}"
            mkdir -p "$OUTDIR"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$OUTDIR/bpa${EXT}" ./cmd/bpa
            cp README.md USAGE.md LICENSE SECURITY.md "$OUTDIR/"
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "bpa_${GOOS}_${GOARCH}.zip" "bpa_${GOOS}_${GOARCH}")
            else
              tar -C dist -czf "dist/bpa_${GOOS}_${GOARCH}.tar.gz" "bpa_${GOOS}_${GOARCH}"
            fi
            rm -r "$OUTDIR"
          done
          (cd dist && sha256sum ./*.zip ./*.tar.gz > checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "open-pan-bpa ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Not an official Palo Alto Networks product. Verify downloads against checksums.txt."
