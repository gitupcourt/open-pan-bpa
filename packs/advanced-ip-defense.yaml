    slug: rb-aid-vpn-inbound
    title: "Advanced IP Defense: block inbound traffic from commercial VPN IPs"
    severity: warning
    params: { direction: inbound, list_label: "commercial VPN", edl_names: ["Advanced IP Defense: VPN"] }
