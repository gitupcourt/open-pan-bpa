# HA, zone protection, interface management, GlobalProtect gateways, crypto.
pack: network-ha
version: 0.1.0
checks:
  - { slug: ha-config-sync, title: HA configuration synchronization should be enabled, severity: warning, section: device, feature: high_availability, evaluator: ha_config_sync, rationale: Unsynced peers drift until failover surprises you., remediation: Enable configuration synchronization., pan_bpa_ids: [136], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-backup-links, title: An HA1 backup path should be configured, severity: warning, section: device, feature: high_availability, evaluator: ha_backup_links, rationale: A single control link is a split-brain waiting to happen., remediation: Configure HA1 backup or a backup peer IP., pan_bpa_ids: [138], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-passive-link-auto, title: Passive link state should be Auto, severity: informational, section: device, feature: high_availability, evaluator: ha_passive_link, rationale: Auto keeps passive links up and skips link negotiation on failover., remediation: Set Passive Link State to auto., pan_bpa_ids: [139], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-heartbeat-backup, title: Heartbeat backup should cover in-band HA1 links, severity: warning, section: device, feature: high_availability, evaluator: ha_heartbeat, rationale: In-band HA1 plus in-band backup dies with the dataplane; heartbeat backup rides the management plane., remediation: Enable Heartbeat Backup., pan_bpa_ids: [141], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-timers-recommended, title: HA timers should be set to Recommended, severity: informational, section: device, feature: high_availability, evaluator: ha_timers, rationale: Vendor-vetted timers balance detection speed against flapping., remediation: Set Election Timers to Recommended., pan_bpa_ids: [142], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-ha1-encryption, title: HA1 communications should be encrypted, severity: warning, section: device, feature: high_availability, evaluator: ha_ha1_encryption, rationale: Config and session sync cross HA1 in cleartext otherwise., remediation: Enable HA1 encryption., pan_bpa_ids: [143], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-session-sync, title: HA2 session synchronization should be enabled, severity: warning, section: device, feature: high_availability, evaluator: ha_state_sync, rationale: Without it every failover drops every session., remediation: Enable session synchronization., pan_bpa_ids: [144], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-ha2-keepalive, title: HA2 keep-alive should be enabled, severity: informational, section: device, feature: high_availability, evaluator: ha_ha2_keepalive, rationale: A dead session-sync path should announce itself before failover., remediation: Enable HA2 keep-alive., pan_bpa_ids: [145], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-aa-ha3, title: Active/Active HA should configure HA3, severity: warning, section: device, feature: high_availability, evaluator: ha_aa_ha3, rationale: Asymmetric flows need HA3 packet forwarding between peers., remediation: Configure the HA3 interface., pan_bpa_ids: [147], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-aa-session-owner, title: Active/Active session owner should be First Packet, severity: informational, section: device, feature: high_availability, evaluator: ha_aa_session_owner, rationale: First-packet ownership avoids cross-peer inspection hops., remediation: Set Session Owner Selection to First Packet., pan_bpa_ids: [148], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-monitoring, title: HA link or path monitoring should be enabled, severity: warning, section: device, feature: high_availability, evaluator: ha_monitoring, rationale: A pair that can't detect failures can't fail over on them., remediation: Enable link and/or path monitoring., pan_bpa_ids: [149], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-link-group, title: Enabled link monitoring needs a link group, severity: informational, section: device, feature: high_availability, evaluator: ha_link_group, rationale: Monitoring without members monitors nothing., remediation: Define a link group., pan_bpa_ids: [150], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: ha-path-group, title: Enabled path monitoring needs a path group, severity: informational, section: device, feature: high_availability, evaluator: ha_path_group, rationale: Monitoring without members monitors nothing., remediation: Define a path group., pan_bpa_ids: [151], references: [https://docs.paloaltonetworks.com/best-practices] }
  - { slug: zpp-recon-protection, title: Zone Protection profiles should enable reconnaissance protection, severity: warning, section: network, feature: zone_protection_profile, evaluator: zpp_recon, rationale: Scans and sweeps are the pre-attack survey; throttle and log them., remediation: Configure Reconnaissance Protection., pan_bpa_ids: [86], references: [https://docs.paloaltonetworks.com/best-practices/dos-and-zone-protection-best-practices] }
  - { slug: zpp-packet-attack, title: Zone Protection profiles should enable packet-based attack protections, severity: warning, section: network, feature: zone_protection_profile, evaluator: zpp_packet_attack, rationale: Malformed options and overlapping-segment games are evasion staples., remediation: Enable malformed-option discard, overlapping-segment mismatch discard, and TCP timestamp stripping., pan_bpa_ids: [87], references: [https://docs.paloaltonetworks.com/best-practices/dos-and-zone-protection-best-practices] }
  - { slug: ifmgmt-encrypted-only, title: Interface management profiles should not permit HTTP/Telnet, severity: critical, section: network, feature: interface_management_profile, evaluator: ifmgmt_encrypted, rationale: Dataplane management access deserves the same encryption floor as the management port., remediation: Remove HTTP and Telnet from the profile., pan_bpa_ids: [228], references: [https://docs.paloaltonetworks.com/best-practices/10-1/administrative-access-best-practices] }
  - { slug: zone-packet-buffer, title: Per-zone packet buffer protection should stay enabled, severity: informational, section: network, feature: zone, evaluator: zone_pbp, rationale: A zone with buffer protection off can exhaust shared buffers for everyone., remediation: Re-enable packet buffer protection on the zone., pan_bpa_ids: [212], references: [https://docs.paloaltonetworks.com/best-practices/dos-and-zone-protection-best-practices] }
  - { slug: gpgw-tls-versions, title: GlobalProtect gateway TLS profiles need TLS 1.2 minimum and max version max, severity: warning, section: network, feature: global_protect_gateway, evaluator: gpgw_tls, rationale: The gateway terminates remote-worker TLS; cap neither direction of the version range., remediation: Set the gateway TLS profile to min TLSv1.2 and max "max"., pan_bpa_ids: [76], references: [https://docs.paloaltonetworks.com/globalprotect] }
  - { slug: gpgw-client-auth, title: GlobalProtect gateways should authenticate clients strongly, severity: warning, section: network, feature: global_protect_gateway, evaluator: gpgw_client_auth, rationale: A gateway without certificate or authentication profiles is an open VPN concentrator., remediation: Attach a certificate profile or an authentication profile., pan_bpa_ids: [77], references: [https://docs.paloaltonetworks.com/globalprotect] }
  - { slug: gpgw-full-tunnel, title: GlobalProtect tunnel configs should route all destinations, severity: warning, section: network, feature: global_protect_gateway, evaluator: gpgw_split_tunnel, rationale: Split-tunneled traffic bypasses every inspection layer the VPN exists to apply., remediation: Include 0.0.0.0/0 in the tunnel access routes., pan_bpa_ids: [78], references: [https://docs.paloaltonetworks.com/globalprotect] }
  - { slug: gpgw-satellite-replay, title: Satellite tunnels should detect replay attacks, severity: informational, section: network, feature: global_protect_gateway, evaluator: gpgw_satellite, rationale: Without anti-replay, captured tunnel packets can be re-injected., remediation: Enable anti-replay on the satellite tunnel configuration., pan_bpa_ids: [79], references: [https://docs.paloaltonetworks.com/globalprotect] }
  - { slug: ike-kem-round, title: IKE crypto AKE rounds should include a post-quantum KEM, severity: informational, section: network, feature: ike_crypto_profiles, evaluator: crypto_ike_kem, rationale: Classical-only key exchange is harvestable against future quantum capability., remediation: Add a KEM (ML-KEM/Kyber, BIKE, HQC, FrodoKEM...) to an AKE round., pan_bpa_ids: [359], references: [https://docs.paloaltonetworks.com/network-security] }
  - { slug: ipsec-kem-round, title: IPsec crypto AKE rounds should include a post-quantum KEM, severity: informational, section: network, feature: ipsec_crypto_profile, evaluator: crypto_ipsec_kem, rationale: Same harvest-now-decrypt-later exposure on the data path; default AKE rounds inherit classical DH., remediation: Add a KEM to the profile's advanced key-exchange options., pan_bpa_ids: [358, 376], references: [https://docs.paloaltonetworks.com/network-security] }
